[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tpfi"
version = "0.1.0"
description = "TPFI IS2: servidor Proxy/Singleton/Observer sobre AWS DynamoDB"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["boto3"]

[project.scripts]
singleton-set = "tpfi.singleton_client:main_set"
singleton-get = "tpfi.singleton_client:main_get"
singleton-list = "tpfi.singleton_client:main_list"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S105"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pyright]
include = ["src/tpfi", "singletonclient.py", "observerclient.py", "singletonproxyobserver.py"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["tpfi"]

[tool.coverage.report]
fail_under = 85
